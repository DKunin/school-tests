name: Проверка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7
      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Проверить и собрать сайт
        run: npm run check
        env:
          SITE_BASE_PATH: /school-tests
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Загрузить статический сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
