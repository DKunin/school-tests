server {
    listen 80;
    listen [::]:80;
    server_name school.kunini.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/apps/school-tests/current;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name school.kunini.ru;

    root /var/apps/school-tests/current;
    index index.html;

    ssl_certificate /home/dekunin/letsencrypt/live/school.kunini.ru/fullchain.pem;
    ssl_certificate_key /home/dekunin/letsencrypt/live/school.kunini.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
